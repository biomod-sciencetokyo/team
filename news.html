<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS | BIOMOD Team Science Tokyo</title>
    <!-- タブに表示されるアイコン -->
    <link rel="icon" href="logo/favicon.ico" sizes="any">
    <link rel="icon" href="logo/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
    <!-- 保存済み or OSの設定からテーマを先に決めて、読み込み時のちらつきを防ぐ -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-white text-dark">

    <div id="header-placeholder"></div>

    <main class="container px-3 px-md-0" style="max-width: 1000px;">

        <div class="text-center" style="margin-top: 80px; margin-bottom: 60px;">
            <h1 class="display-5 fw-bold text-custom-blue" style="letter-spacing: 0.1em;">NEWS</h1>
            <p class="text-muted small mt-2" style="letter-spacing: 0.05em;">お知らせ一覧</p>
        </div>

        <section class="fade-in-section my-block">
            <!-- トップページのLATEST NEWSと同様に、全体を白背景のカードで囲むデザインに統一 -->
            <div id="news-list" class="bg-white rounded-3 shadow-sm p-3 p-md-4 border">
                <p class="text-muted text-center my-4">読み込み中...</p>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="news-render.js"></script>
    <script>NewsRender.renderList('#news-list', 'news/news.json');</script>
</body>

</html>
