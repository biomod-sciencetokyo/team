        /* スクロール時のヘッダー固定対策 */
        body { padding-top: 56px; }

            text-decoration: none;

        .news-item:hover .news-arrow {
            transform: translateX(5px); /* マウスを乗せたら矢印を右に少し動かす */
        }
        .news-arrow {
            transition: transform 0.2s;
        }
    </style>
