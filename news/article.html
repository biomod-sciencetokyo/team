<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS | BIOMOD Team Science Tokyo</title>
    <!-- タブに表示されるアイコン -->
    <link rel="icon" href="../logo/favicon.ico" sizes="any">
    <link rel="icon" href="../logo/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../logo/apple-touch-icon.png">
    <!-- Bootstrapの読み込み -->
    <!-- 保存済み or OSの設定からテーマを先に決めて、読み込み時のちらつきを防ぐ -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-bs-theme', t);
        })();
    </script>
    <!-- フォント（英字見出し：Outfit / 日本語：Noto Sans JP） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@500;600;700;800&family=DotGothic16&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body class="bg-white text-dark">

    <div id="header-placeholder"></div>

    <!-- 見出し帯（背景写真：img/placeholder/page-news.svg を差し替え） -->
    <section class="page-hero" style="--hero-img: url('../img/placeholder/page-news.svg');">
        <div class="container page-hero-inner px-4 px-md-3">
            <p class="page-hero-eyebrow">Information</p>
            <h1 class="page-hero-title">NEWS</h1>
            <p class="page-hero-sub">お知らせ</p>
            <nav class="page-hero-crumb" aria-label="パンくずリスト"><a href="../index.html">TOP</a><span>/</span><a href="../news.html">NEWS</a><span>/</span>記事</nav>
        </div>
    </section>

    <main class="container px-4 px-md-3 mb-5 pb-5" style="max-width: 1000px;">
        <article id="article" class="panel p-4 p-md-5 mx-auto" style="max-width: 820px;">
            <p class="text-muted text-center my-4">読み込み中...</p>
        </article>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../main.js"></script>
    <script src="../news-render.js"></script>
    <script>NewsRender.renderArticle('#article', 'news.json');</script>
</body>

</html>
