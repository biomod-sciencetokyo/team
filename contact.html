<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT | BIOMOD Team Science Tokyo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-dark">

    <div id="header-placeholder"></div>

    <main class="container px-3 px-md-0" style="max-width: 1000px;">
        
        <div class="text-center" style="margin-top: 80px; margin-bottom: 60px;">
            <h1 class="display-5 fw-bold text-custom-blue" style="letter-spacing: 0.1em;">CONTACT</h1>
            <p class="text-muted small mt-2" style="letter-spacing: 0.05em;">お問い合わせ</p>
        </div>

        <section class="fade-in-section my-block text-center" style="max-width: 720px; margin-left: auto; margin-right: auto;">
            <p class="fs-5 text-secondary mb-4" style="line-height: 2.0; letter-spacing: 0.03em;">
                BIOMOD Team Science Tokyoに関するご質問、共同研究や協賛のご相談など、<br class="d-none d-md-inline">あらゆるお問い合わせは以下のメールアドレスよりお気軽にご連絡ください。
            </p>
            <p class="text-muted small mb-4">※クリックするとお使いのメールアプリが起動します。</p>
            
            <div class="mt-4">
                <a href="mailto:t2biomod@gmail.com" class="btn btn-custom-contact fw-bold px-5 py-3 rounded-pill fs-5 shadow-sm">
                    ✉ メールを送信する (t2biomod@gmail.com)
                </a>
            </div>
        </section>

        <hr class="my-5 border-secondary-subtle">

        <section class="fade-in-section my-block">
            <h2 class="display-6 fw-bold text-center text-custom-blue mb-5" style="letter-spacing: 0.1em;">ACCESS</h2>
            
            <!-- max-widthで全体の幅を制限し、中央に配置 -->
            <div class="row align-items-center gx-5 mx-auto" style="max-width: 900px;">
                
                <!-- テキスト部分（スマホ：上 / PC：左） -->
                <div class="col-md-5 mb-4 mb-md-0 text-start">
                    <div class="text-secondary fs-5" style="line-height: 2.0; letter-spacing: 0.03em;">
                        <p class="fw-bold text-dark mb-2">東京科学大学（旧・東京工業大学）<br>横浜キャンパス</p>
                        <p class="mb-2">〒226-8503<br>神奈川県横浜市緑区長津田町 4259</p>
                        <p class="mb-0">すずかけ台キャンパス<br>浜田研究室</p>
                    </div>
                </div>
                
                <!-- マップ部分（スマホ：下 / PC：右） -->
                <div class="col-md-7">
                    <!-- 横並び時の視認性を確保するため ratio-4x3 を指定 -->
                    <div class="ratio ratio-4x3 rounded-3 border shadow-sm overflow-hidden w-100">
                        <iframe src="https://maps.google.com/maps?q=School%20of%20Life%20Science%20and%20Technology%2C%20Institute%20of%20Science%20Tokyo&t=&z=16&ie=UTF8&iwloc=&output=embed" 
                            style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
                
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
